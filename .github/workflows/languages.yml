name: Update language stats

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render languages.svg
        # STATS_TOKEN: a token with read access to private repos; the update is skipped without it
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "STATS_TOKEN not set, skipping"; exit 0; fi
          python scripts/languages.py "${{ github.repository_owner }}" languages.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --cached --quiet || { git commit -m "Update language stats" && git push; }
