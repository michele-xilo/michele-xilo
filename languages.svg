<svg xmlns="http://www.w3.org/2000/svg" width="480" height="274" viewBox="0 0 480 274">
<style>:root{--bg:#ffffff;--border:#d0d7de;--title:#0969da;--text:#1f2328;--muted:#656d76;--track:#eaeef2}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--border:#30363d;--title:#58a6ff;--text:#e6edf3;--muted:#8b949e;--track:#21262d}}text{font-family:'Segoe UI',Ubuntu,Helvetica,sans-serif}.t{font-size:16px;font-weight:600;fill:var(--title)}.s{font-size:11px;fill:var(--muted)}.n{font-size:13px;fill:var(--text)}.p{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}.big{font-size:22px;font-weight:700;fill:var(--text)}.seg{fill:none;animation:draw 1.2s cubic-bezier(.4,0,.2,1) both}@keyframes draw{from{stroke-dasharray:0 1000}}.row{opacity:0;animation:fade .5s ease-out forwards}@keyframes fade{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}.bar{transform-box:fill-box;transform-origin:left;animation:grow .9s cubic-bezier(.4,0,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}</style>
